<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentix AI · Inteligencia Conversacional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Resolve theme before paint to avoid flash-of-dark on light reload -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sentix-theme') || 'sistema'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = stored === 'sistema' ? (prefersDark ? 'dark' : 'light') : stored === 'claro' ? 'light' : 'dark'
          document.documentElement.dataset.theme = resolved
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
